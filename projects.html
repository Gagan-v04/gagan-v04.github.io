    <script src="data.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('project-feed');

            if (typeof allProjects === 'undefined') {
                container.innerHTML = '<p class="text-[#E63946] font-bold">Error: Could not load project data.</p>';
                return;
            }

            container.innerHTML = renderProjectHTML(allProjects);
            // Run reveal AFTER cards are injected into DOM
            initializeScrollReveal();
            setupNavbar();
        });

        function renderProjectHTML(projectList) {
            let html = '';
            for (let i = 0; i < projectList.length; i++) {
                const project = projectList[i];

                let tagsHtml = '';
                for (let j = 0; j < project.tags.length; j++) {
                    tagsHtml += '<span class="tech-tag">' + project.tags[j] + '</span>';
                }

                const ghIcon = '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.009-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.026 2.747-1.026.546 1.379.202 2.398.1 2.65.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"/></svg>';

                let githubHtml = project.github
                    ? '<a href="' + project.github + '" target="_blank" rel="noopener noreferrer" class="btn-primary" style="background:#000;">' + ghIcon + 'View on GitHub</a>'
                    : '';

                html +=
                    '<article class="project-card reveal">' +
                    createMediaBlock(project) +
                    '<div class="project-card-content">' +
                    '<h3 class="project-card-title">' + project.title + '</h3>' +
                    '<div class="project-card-desc">' + project.description + '</div>' +
                    '<div class="project-card-tags">' + tagsHtml + '</div>' +
                    (githubHtml ? '<div class="project-card-footer">' + githubHtml + '</div>' : '') +
                    '</div>' +
                    '</article>';
            }
            return html;
        }

        function createMediaBlock(project) {
            if (project.mediaType === 'video' && project.mediaSrc) {
                const isVertical = project.aspect === '9:16';
                const wrapClass = 'project-media-wrapper' + (isVertical ? ' is-vertical' : '');
                return '<div class="' + wrapClass + '">' +
                    '<video controls muted loop playsinline poster="' + (project.poster || '') + '" style="width:100%;height:100%;display:block;object-fit:' + (isVertical ? 'contain' : 'cover') + ';">' +
                    '<source src="' + project.mediaSrc + '" type="video/mp4">' +
                    '</video>' +
                    '</div>';
            } else if (project.mediaType === 'image' && project.mediaSrc) {
                return '<div class="project-media-wrapper">' +
                    '<img src="' + project.mediaSrc + '" alt="' + project.title + '" style="width:100%;height:100%;display:block;object-fit:cover;">' +
                    '</div>';
            }
            return '<div class="project-media-wrapper" style="background:#eee;display:flex;align-items:center;justify-content:center;"><span style="font-weight:700;font-size:1.25rem;text-transform:uppercase;color:#999;">No Preview</span></div>';
        }

        // Shadow on scroll for sticky nav
        function setupNavbar() {
            const navInner = document.getElementById('navbar');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 10) {
                    navInner.classList.add('shadow-[0_4px_0_0_rgba(0,0,0,1)]');
                } else {
                    navInner.classList.remove('shadow-[0_4px_0_0_rgba(0,0,0,1)]');
                }
            });
        }

        function initializeScrollReveal() {
            const revealElements = document.querySelectorAll('.reveal');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.05, rootMargin: '0px 0px 0px 0px' });

            revealElements.forEach((el, idx) => {
                const rect = el.getBoundingClientRect();
                if (rect.top < window.innerHeight + 100) {
                    // Already in or near viewport — reveal immediately with slight delay
                    el.style.transitionDelay = (idx * 40) + 'ms';
                    el.classList.add('reveal-visible');
                } else {
                    observer.observe(el);
                }
            });
        }
    </script>
